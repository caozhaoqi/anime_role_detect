  - {id: 95,  name: layla,             img_count: 1,  distinct_post_ids: 1}
  - {id: 99,  name: lumine,            img_count: 11, distinct_post_ids: 11}
  - {id: 119, name: piper,             img_count: 1,  distinct_post_ids: 1}
  - {id: 129, name: sapphire,          img_count: 1,  distinct_post_ids: 1}
  - {id: 165, name: yuuka,             img_count: 3,  distinct_post_ids: 3}

# ---- 切分 ----
split:
  dir: data/splits/seed42
  split_hash: "71b7101b47eb266579dea81bd837dded9c55e2e09c6e31124de1133abd733eeb"
  seed: 42
  rule: "按 post_id 分组切分（同一 post 的所有图须在同一 split）；严禁 random_split 同源"

# ---- 评估预处理 ----
preprocessing:
  canonical:
    train: "Resize(288) -> CenterCrop(256)"
    eval:  "Resize(288) -> CenterCrop(256)"
  legacy_broken:
    note: "Resize((256,256)) 改变长宽比，与训练分布不匹配，val 上差 1.77~2.02 点（正确性问题非性能）"
    status: forbidden

# ---- 指标口径 ----
metrics:
  forbidden:
    - macro_f1_all171   # 含 4 个不可评类，固定 2.34% 折扣，无信息量，从报表删除
  contract_baseline_v7:  # 167 类契约口径，必须保留作对照锚点
    test:  {n: 1608, top1: 0.5989, top5: 0.7767, macro_f1: 0.5533, weighted_f1: 0.5946, balanced_acc: 0.5681}
    val:   {n: 1585, top1: 0.6183, top5: 0.7779, macro_f1: 0.5738}
    leakage_check: "test-val Top-1 = -1.94pt, z=-1.12, p=0.26 (不显著) -> 已治愈"
  v8_target: {top1: [0.62, 0.65], macro_f1_167: [0.57, 0.60]}
