# configs/label_contract.yaml
# 标签空间 / 评估口径的单一可信源（single source of truth）。
# 代码、训练脚本、评估报告都必须引用本文件，禁止各自硬编码。
schema_version: 1
frozen_at: "2026-08-15"
source_registry: configs/class_registry_v2.json
source_baseline_report: deliverables/gstack/model-baseline-v7-2026-08-10.md

# ---- 标签空间 ----
label_space:
  raw_total: 171                  # 注册表总类数 (class_registry_v2.json)
  eval_status_distribution:       # 来自注册表 eval_status 字段
    FULL: 145
    PARTIAL: 12
    TRAIN_ONLY: 10
    NOT_IN_LABEL_SPACE: 4
  # 对外报数契约：剔除不可评类后的口径
  contract_classes: 167           # v7 基线权威口径（基于当时 4 个 TRAIN_ONLY 单图类）
  rule: |
    对外评估时，从原始 171 类中剔除 eval_status == "TRAIN_ONLY" 的类。
    v7 基线按 4 个单图 TRAIN_ONLY 类得到 167 口径；注册表当前标记 10 个 TRAIN_ONLY，
    若 v8 重训后 TRAIN_ONLY 数变化，167 对照数失效，必须按新切分复算并回填本文件。

# 当前注册表标记的 TRAIN_ONLY 类（直接读此列表决定剔除，勿硬编码）
train_only_classes:
  - {id: 43,  name: ellen,             img_count: 2,  distinct_post_ids: 2}
  - {id: 45,  name: evelyn,            img_count: 1,  distinct_post_ids: 1}
  - {id: 48,  name: fischl,            img_count: 1,  distinct_post_ids: 1}
