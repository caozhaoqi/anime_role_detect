version: '3.8'

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: anime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M      # 压缩：512M -> 256M
          cpus: "0.2"

  mysql:
    image: mysql:8.0
    container_name: anime-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-anime_role_detect}
      MYSQL_USER: ${MYSQL_USER:-anime_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-anime_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G        # 压缩：2G -> 1G
          cpus: "0.5"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anime-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped
    # 优化：采用轻量级 TCP 探测，替换消耗内存的 rabbitmq-diagnostics
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M      # 压缩：1G -> 512M
          cpus: "0.25"

  base:
    build:
      context: .
      dockerfile: deployment/Dockerfile.base
      cache_from:
        - ardc/base:latest
    image: ardc/base:latest
    networks:
      - backend

  ml-base:
    build:
      context: .
      dockerfile: deployment/Dockerfile.ml-base
      cache_from:
        - ardc/ml-base:latest
        - ardc/base:latest
    image: ardc/ml-base:latest
    networks:
      - backend
    depends_on:
      base:
        condition: service_completed_successfully

  api-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api-service
      cache_from:
        - ardc/api-service:latest
        - ardc/base:latest
    image: ardc/api-service:latest
    pull_policy: if_not_present   # 优化：优先使用本地构建的镜像
    container_name: anime-api-service
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - MODEL_SERVICE_HOST=model-service
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER:-anime_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-anime_pass}
      - DB_NAME=${MYSQL_DATABASE:-anime_role_detect}
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mysql:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G        # 压缩：2G -> 1G
          cpus: "0.5"

  model-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile.model-service
      cache_from:
        - ardc/model-service:latest
        - ardc/ml-base:latest
    image: ardc/model-service:latest
    pull_policy: if_not_present   # 优化：优先使用本地构建的镜像
    container_name: anime-model-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
    networks:
      - backend
    depends_on:
      ml-base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G        # 压缩：8G -> 4G（深度学习模型，保留最大的一块）
          cpus: "1.5"

  api-gateway:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api-gateway
      cache_from:
        - ardc/api-gateway:latest
        - ardc/base:latest
    image: ardc/api-gateway:latest
    pull_policy: if_not_present
    container_name: anime-api-gateway
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - API_SERVICE_HOST=api-service
      - LOG_LEVEL=INFO
    networks:
      - backend
      - frontend
    depends_on:
      base:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M      # 压缩：1G -> 512M
          cpus: "0.25"

  multimedia-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile.multimedia-service
      cache_from:
        - ardc/multimedia-service:latest
        - ardc/base:latest
    image: ardc/multimedia-service:latest
    pull_policy: if_not_present
    container_name: anime-multimedia-service
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    volumes:
      - multimedia-data:/app/data
    networks:
      - backend
    depends_on:
      base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M      # 压缩：1G -> 512M
          cpus: "0.25"

  search-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile.search-service
      cache_from:
        - ardc/search-service:latest
        - ardc/base:latest
    image: ardc/search-service:latest
    pull_policy: if_not_present
    container_name: anime-search-service
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M      # 压缩：1G -> 512M
          cpus: "0.25"

  search-worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile.search-worker
      cache_from:
        - ardc/search-worker:latest
        - ardc/base:latest
    image: ardc/search-worker:latest
    pull_policy: if_not_present
    container_name: anime-search-worker
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G      # 压缩：4G -> 1.5G
          cpus: "0.5"

  inference-worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile.inference-worker
      cache_from:
        - ardc/inference-worker:latest
        - ardc/ml-base:latest
    image: ardc/inference-worker:latest
    pull_policy: if_not_present
    container_name: anime-inference-worker
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      ml-base:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G      # 压缩：4G -> 1.5G
          cpus: "0.5"

  monitoring:
    build:
      context: .
      dockerfile: deployment/Dockerfile.monitoring
      cache_from:
        - ardc/monitoring:latest
    image: ardc/monitoring:latest
    pull_policy: if_not_present
    container_name: anime-monitoring
    ports:
      - "8888:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    networks:
      - frontend
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M      # 压缩：512M -> 256M
          cpus: "0.1"

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
      cache_from:
        - ardc/frontend:latest
    image: ardc/frontend:latest
    pull_policy: if_not_present
    container_name: anime-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://localhost:8080
    networks:
      - frontend
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M      # 压缩：1G -> 512M
          cpus: "0.25"

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
  rabbitmq-data:
    driver: local
  multimedia-data:
    driver: local