version: '3.8'

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: anime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: anime-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-anime_role_detect}
      MYSQL_USER: ${MYSQL_USER:-anime_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-anime_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-anime_user}", "-p${MYSQL_PASSWORD:-anime_pass}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anime-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  model-service:
    build:
      context: .
      dockerfile: Dockerfile.model
    container_name: anime-model-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/cache/huggingface
      - KERAS_HOME=/app/cache/keras
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    volumes:
      - model-cache:/app/cache
      - ./models:/app/models
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
        reservations:
          memory: 4G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-api-service
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/cache/huggingface
      - KERAS_HOME=/app/cache/keras
      - REDIS_HOST=redis
      - MODEL_SERVICE_HOST=model-service
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER:-anime_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-anime_pass}
      - DB_NAME=${MYSQL_DATABASE:-anime_role_detect}
      - LOG_LEVEL=INFO
    volumes:
      - api-cache:/app/cache
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      model-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  multimedia-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-multimedia-service
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    volumes:
      - multimedia-data:/app/data
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"

  search-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-search-service
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"

  search-worker:
    build:
      context: .
      dockerfile: Dockerfile.model
    container_name: anime-search-worker
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/cache/huggingface
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - LOG_LEVEL=INFO
    volumes:
      - worker-cache:/app/cache
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.0"
        reservations:
          memory: 2G
          cpus: "0.5"
    command: ["python", "src/services/search_service/search_worker.py"]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-api-gateway
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - API_SERVICE_HOST=api-service
      - LOG_LEVEL=INFO
    networks:
      - backend
      - frontend
    depends_on:
      redis:
        condition: service_healthy
      api-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  monitor-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-monitor-dashboard
    ports:
      - "8888:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    networks:
      - frontend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
        reservations:
          memory: 256M
          cpus: "0.1"

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: anime-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://localhost:8080
    networks:
      - frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
  rabbitmq-data:
    driver: local
  model-cache:
    driver: local
  api-cache:
    driver: local
  multimedia-data:
    driver: local
  worker-cache:
    driver: local