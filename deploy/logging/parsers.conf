# Fluent-bit 解析器配置

# JSON 解析器 — 用于 structured_*.jsonl (loguru serialize=True 格式)
[PARSER]
    Name        json
    Format      json
    Time_Key    record.time
    Time_Format %Y-%m-%dT%H:%M:%S.%f%z
    Time_Keep   On

# Loguru 文本日志解析器
[PARSER]
    Name        loguru
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \| (?<level>\w+)\s*\| (?<logger>[^:]+):(?<function>[^:]+):(?<line>\d+) \| (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L
