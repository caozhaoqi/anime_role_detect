# ============================================================
# Fluent-bit 配置 — 采集 anime_role_detect 结构化 JSONL 日志
# 参考 K8s 文档 fluent-bit → ES → kibana 日志聚合架构
#
# 用法 (docker-compose):
#   挂载 logs/ 目录到 fluent-bit 容器，自动采集 structured_*.jsonl
#
# 用法 (K8s):
#   DaemonSet 模式自动采集 /var/log/containers/*.log (容器 stdout)
# ============================================================

[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ---- 输入: tail 结构化 JSONL 日志文件 (docker-compose 模式) ----
[INPUT]
    Name              tail
    Path              /app/logs/structured_*.jsonl
    Parser            json
    Tag               ard.structured
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    DB                /fluent-bit/state/tail.db

# ---- 输入: tail 通用日志文件 ----
[INPUT]
    Name              tail
    Path              /app/logs/system/*.log, /app/logs/inference/*.log
    Parser            loguru
    Tag               ard.logs
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

# ---- 过滤: 添加集群/命名空间元数据 ----
[FILTER]
    Name          modify
    Match         ard.*
    Add           cluster   anime-role-detect
    Add           service   ${ARD_SERVICE_NAME}

# ---- 输出: stdout (调试用) ----
[OUTPUT]
    Name          stdout
    Match         ard.*
    Format        json_lines

