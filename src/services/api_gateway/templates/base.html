<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Anime Role Detect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(156, 163, 175, 0.1);
            border-radius: 3px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        .gantt-bar {
            transition: opacity 0.2s, transform 0.2s;
        }
        .gantt-bar:hover {
            opacity: 0.9;
            transform: scaleY(1.15);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-6 border-b border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-server text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-lg">ARD Monitor</h1>
                        <p class="text-xs text-gray-400">系统监控中心</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                {% for item in nav_items %}
                <a href="{{ item.url }}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 {% if item.active %}bg-indigo-600 text-white{% else %}text-gray-400 hover:bg-gray-700 hover:text-white{% endif %}">
                    <i class="fas {{ item.icon }} w-5 h-5"></i>
                    <span>{{ item.label }}</span>
                </a>
                {% endfor %}
            </nav>
            <div class="p-4 border-t border-gray-700">
                <div class="bg-gray-700/50 rounded-lg p-3">
                    <div class="flex items-center gap-2 text-xs text-gray-400">
                        <i class="fas fa-clock"></i>
                        <span>最后更新: <span id="last-update-time">{{ last_update }}</span></span>
                    </div>
                </div>
            </div>
        </aside>
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-gray-800/50 border-b border-gray-700 flex items-center justify-between px-6">
                <div>
                    <h2 class="text-lg font-semibold text-white">{{ page_title }}</h2>
                    <p class="text-xs text-gray-400">{{ page_description }}</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="refreshData()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-sync-alt"></i>
                        <span>刷新</span>
                    </button>
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-green-500/20 text-green-400 rounded-full text-xs">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span>系统运行中</span>
                    </div>
                </div>
            </header>
            <div class="flex-1 overflow-auto p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
