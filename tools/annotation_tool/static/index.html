<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫角色标注工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }
        .header {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 1.5em; margin-bottom: 10px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-secondary { background: #2196F3; color: white; }
        .btn-secondary:hover { background: #1976D2; }
        .btn-warning { background: #FF9800; color: white; }
        .btn-warning:hover { background: #F57C00; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #D32F2F; }
        .btn-gray { background: #666; color: white; }
        .btn-gray:hover { background: #555; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .image-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        .image-header {
            padding: 10px 15px;
            background: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .image-viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: #0f0f23;
            padding: 15px;
        }
        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .image-controls {
            padding: 15px;
            background: #1f2937;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .annotation-panel {
            margin-top: 15px;
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }
        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .role-item {
            padding: 10px;
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-item:hover { border-color: #4CAF50; }
        .role-item.selected {
            border-color: #4CAF50;
            background: #2e7d32;
        }
        .role-item .name { font-weight: bold; font-size: 14px; }
        .role-item .name-cn { font-size: 12px; color: #aaa; margin-top: 3px; }
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 10px 15px;
            background: #1f2937;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .stat-item { text-align: center; }
        .stat-item .value { font-size: 1.5em; font-weight: bold; color: #4CAF50; }
        .stat-item .label { font-size: 12px; color: #888; }
        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar .fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab {
            padding: 8px 16px;
            background: #333;
            border: none;
            border-radius: 4px 4px 0 0;
            color: #aaa;
            cursor: pointer;
        }
        .tab.active { background: #16213e; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .checkbox-group { display: flex; gap: 15px; margin: 10px 0; flex-wrap: wrap; }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: #1a1a2e;
            border-radius: 4px;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #16213e;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h2 { font-size: 1.3em; }
        .modal-close { background: none; border: none; color: #aaa; font-size: 1.5em; cursor: pointer; }
        .role-list { max-height: 300px; overflow-y: auto; }
        .role-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 1.2em;
        }
        .keyboard-hint {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .selected-roles {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .selected-role-tag {
            padding: 5px 12px;
            background: #4CAF50;
            border-radius: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .selected-role-tag .remove {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>📝 标注工具</h1>
                <div class="form-group">
                    <label>图片目录</label>
                    <input type="text" id="imageDir" placeholder="输入图片目录路径" value="/Users/caozhaoqi/PycharmProjects/anime_role_detect/data/combined_dataset">
                </div>
                <button class="btn btn-primary" onclick="scanDirectory()" style="width:100%">🔍 扫描目录</button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="value" id="totalCount">0</div>
                    <div class="label">总图片</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="annotatedCount">0</div>
                    <div class="label">已标注</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="progressPercent">0%</div>
                    <div class="label">进度</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="showTab('roles')">角色</button>
                <button class="tab" onclick="showTab('manage')">管理</button>
                <button class="tab" onclick="showTab('export')">导出</button>
            </div>

            <div id="tab-roles" class="tab-content active">
                <button class="btn btn-secondary btn-sm" onclick="openRoleModal()" style="width:100%">➕ 添加角色</button>
                <div id="roleGrid" class="role-grid"></div>
            </div>

            <div id="tab-manage" class="tab-content">
                <div class="form-group">
                    <label>标注者</label>
                    <input type="text" id="annotatorName" placeholder="输入你的名字" value="anonymous">
                </div>
                <button class="btn btn-warning btn-sm" onclick="jumpToUnannotated()" style="width:100%">⏭️ 跳转到未标注</button>
                <button class="btn btn-gray btn-sm" onclick="loadAnnotations()" style="width:100%; margin-top:10px">🔄 刷新标注</button>
            </div>

            <div id="tab-export" class="tab-content">
                <button class="btn btn-secondary btn-sm" onclick="exportJSON()" style="width:100%">📥 导出JSON</button>
                <button class="btn btn-secondary btn-sm" onclick="exportCSV()" style="width:100%; margin-top:10px">📊 导出CSV</button>
                <div style="margin-top:15px">
                    <label>角色统计</label>
                    <div id="roleStats" style="font-size:12px; color:#aaa;"></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="image-container">
                <div class="image-header">
                    <span id="imageTitle">请先扫描目录</span>
                    <span id="imageCounter">0 / 0</span>
                </div>
                <div class="image-viewer" id="imageViewer">
                    <div class="no-image">请扫描目录加载图片</div>
                </div>
                <div class="image-controls">
                    <button class="btn btn-gray" onclick="prevImage()">⬅️ 上一个</button>
                    <button class="btn btn-gray" onclick="nextImage()">➡️ 下一个</button>
                    <input type="number" id="jumpInput" placeholder="序号" style="width:60px" onkeypress="if(event.key==='Enter')jumpToImage()">
                    <button class="btn btn-primary" onclick="saveAnnotation()">💾 保存标注</button>
                    <button class="btn btn-warning" onclick="markNSFW()">🔞 标记R18</button>
                    <button class="btn btn-danger" onclick="clearSelection()">🗑️ 清除</button>
                </div>
            </div>

            <div class="annotation-panel">
                <div class="form-group">
                    <label>已选角色</label>
                    <div id="selectedRoles" class="selected-roles"></div>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="multiRoleCheck" onchange="updateAnnotation()">
                        多角色图片
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="nsfwCheck" onchange="updateAnnotation()">
                        R18内容
                    </label>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="notesInput" placeholder="可选备注" onchange="updateAnnotation()">
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="roleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加角色</h2>
                <button class="modal-close" onclick="closeRoleModal()">×</button>
            </div>
            <div class="form-group">
                <label>角色ID (英文)</label>
                <input type="text" id="roleId" placeholder="如:anya">
            </div>
            <div class="form-group">
                <label>角色名 (英文)</label>
                <input type="text" id="roleName" placeholder="如:Anya">
            </div>
            <div class="form-group">
                <label>角色名 (中文)</label>
                <input type="text" id="roleNameCn" placeholder="如:阿尼亚">
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="roleCategory" placeholder="如:间谍过家家">
            </div>
            <button class="btn btn-primary" onclick="addRole()" style="width:100%">保存</button>
            <hr style="margin:15px 0; border-color:#333">
            <div class="form-group">
                <label>批量导入角色 (JSON)</label>
                <textarea id="batchRoles" rows="4" placeholder='[{"id":"xxx","name":"XXX","name_cn":"xxx"}]' style="width:100%; background:#1a1a2e; color:#eee; border:1px solid #333; border-radius:4px; padding:8px"></textarea>
            </div>
            <button class="btn btn-secondary" onclick="batchImportRoles()" style="width:100%">批量导入</button>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let images = [];
        let currentIndex = 0;
        let roles = [];
        let annotations = {};
        let selectedRoleIds = [];

        async function scanDirectory() {
            const dir = document.getElementById('imageDir').value;
            if (!dir) { alert('请输入目录路径'); return; }

            const resp = await fetch(`${API_BASE}/api/directory/scan`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({directory: dir})
            });
            const data = await resp.json();

            if (data.success) {
                images = data.images;
                currentIndex = 0;
                await loadAnnotations();
                showImage();
                updateStats();
                showToast(`加载了 ${images.length} 张图片`);
            } else {
                alert('扫描失败: ' + (data.error || '未知错误'));
            }
        }

        async function loadAnnotations() {
            const resp = await fetch(`${API_BASE}/api/annotations`);
            const data = await resp.json();
            if (data.success) {
                annotations = data.annotations;
            }
            await loadRoles();
            updateStats();
            showImage();
        }

        async function loadRoles() {
            const resp = await fetch(`${API_BASE}/api/roles`);
            const data = await resp.json();
            roles = data.roles || [];
            renderRoleGrid();
        }

        function renderRoleGrid() {
            const grid = document.getElementById('roleGrid');
            grid.innerHTML = roles.map(role => `
                <div class="role-item" data-id="${role.id}" onclick="toggleRole('${role.id}')">
                    <div class="name">${role.name}</div>
                    ${role.name_cn ? `<div class="name-cn">${role.name_cn}</div>` : ''}
                </div>
            `).join('');
        }

        function toggleRole(roleId) {
            const idx = selectedRoleIds.indexOf(roleId);
            if (idx > -1) {
                selectedRoleIds.splice(idx, 1);
            } else {
                selectedRoleIds.push(roleId);
            }
            updateRoleSelection();
            updateAnnotation();
        }

        function updateRoleSelection() {
            document.querySelectorAll('.role-item').forEach(el => {
                el.classList.toggle('selected', selectedRoleIds.includes(el.dataset.id));
            });
            const container = document.getElementById('selectedRoles');
            container.innerHTML = selectedRoleIds.map(id => {
                const role = roles.find(r => r.id === id);
                return `<span class="selected-role-tag">${role ? role.name : id}<span class="remove" onclick="event.stopPropagation(); toggleRole('${id}')">×</span></span>`;
            }).join('');
        }

        function showImage() {
            if (images.length === 0) {
                document.getElementById('imageViewer').innerHTML = '<div class="no-image">暂无图片</div>';
                document.getElementById('imageTitle').textContent = '请先扫描目录';
                document.getElementById('imageCounter').textContent = '0 / 0';
                return;
            }

            const img = images[currentIndex];
            document.getElementById('imageViewer').innerHTML = `<img src="file://${img.path}" alt="${img.filename}">`;
            document.getElementById('imageTitle').textContent = img.filename;
            document.getElementById('imageCounter').textContent = `${currentIndex + 1} / ${images.length}`;

            const ann = annotations[img.path];
            if (ann) {
                selectedRoleIds = [...(ann.roles || [])];
                document.getElementById('multiRoleCheck').checked = ann.is_multi_role || false;
                document.getElementById('nsfwCheck').checked = ann.is_nsfw || false;
                document.getElementById('notesInput').value = ann.notes || '';
            } else {
                selectedRoleIds = [];
                document.getElementById('multiRoleCheck').checked = false;
                document.getElementById('nsfwCheck').checked = false;
                document.getElementById('notesInput').value = '';
            }
            updateRoleSelection();
        }

        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                showImage();
            }
        }

        function nextImage() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                showImage();
            }
        }

        function jumpToImage() {
            const idx = parseInt(document.getElementById('jumpInput').value) - 1;
            if (idx >= 0 && idx < images.length) {
                currentIndex = idx;
                showImage();
            }
        }

        function jumpToUnannotated() {
            for (let i = 0; i < images.length; i++) {
                if (!annotations[images[i].path]) {
                    currentIndex = i;
                    showImage();
                    showToast('已跳转到未标注图片');
                    return;
                }
            }
            showToast('所有图片都已标注！');
        }

        function updateAnnotation() {
            const img = images[currentIndex];
            if (!img) return;

            const roleNames = selectedRoleIds.map(id => {
                const role = roles.find(r => r.id === id);
                return role ? role.name : id;
            });

            annotations[img.path] = {
                image_path: img.path,
                roles: roleNames,
                is_multi_role: document.getElementById('multiRoleCheck').checked,
                is_nsfw: document.getElementById('nsfwCheck').checked,
                notes: document.getElementById('notesInput').value,
                annotator: document.getElementById('annotatorName').value || 'anonymous',
                timestamp: new Date().toISOString()
            };
            updateStats();
        }

        async function saveAnnotation() {
            updateAnnotation();
            const img = images[currentIndex];
            const ann = annotations[img.path];

            const resp = await fetch(`${API_BASE}/api/annotation`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(ann)
            });
            const data = await resp.json();

            if (data.success) {
                showToast('✅ 标注已保存');
                updateStats();
            } else {
                showToast('❌ 保存失败');
            }
        }

        async function markNSFW() {
            updateAnnotation();
            document.getElementById('nsfwCheck').checked = true;
            updateAnnotation();
            await saveAnnotation();

            const img = images[currentIndex];
            await fetch(`${API_BASE}/api/nsfw/move`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({source_path: img.path})
            });

            showToast('🔞 图片已移动到可疑目录');
            nextImage();
        }

        function clearSelection() {
            selectedRoleIds = [];
            document.getElementById('multiRoleCheck').checked = false;
            document.getElementById('nsfwCheck').checked = false;
            document.getElementById('notesInput').value = '';
            updateRoleSelection();
            updateAnnotation();
        }

        function updateStats() {
            const total = images.length;
            const annotated = Object.keys(annotations).length;
            const percent = total > 0 ? Math.round(annotated / total * 100) : 0;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('annotatedCount').textContent = annotated;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';

            fetch(`${API_BASE}/api/stats`).then(r => r.json()).then(data => {
                if (data.success) {
                    const stats = document.getElementById('roleStats');
                    const sortedRoles = Object.entries(data.role_counts || {})
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10);
                    stats.innerHTML = sortedRoles.map(([name, count]) =>
                        `<div>${name}: ${count}</div>`
                    ).join('') || '暂无统计数据';
                }
            });
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function openRoleModal() {
            document.getElementById('roleModal').classList.add('show');
        }

        function closeRoleModal() {
            document.getElementById('roleModal').classList.remove('show');
        }

        async function addRole() {
            const role = {
                id: document.getElementById('roleId').value,
                name: document.getElementById('roleName').value,
                name_cn: document.getElementById('roleNameCn').value,
                category: document.getElementById('roleCategory').value
            };

            if (!role.id || !role.name) {
                alert('请填写角色ID和名称');
                return;
            }

            const resp = await fetch(`${API_BASE}/api/roles`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(role)
            });

            if (resp.ok) {
                showToast('✅ 角色已添加');
                await loadRoles();
                closeRoleModal();
                document.getElementById('roleId').value = '';
                document.getElementById('roleName').value = '';
                document.getElementById('roleNameCn').value = '';
                document.getElementById('roleCategory').value = '';
            }
        }

        async function batchImportRoles() {
            const text = document.getElementById('batchRoles').value;
            try {
                const roles = JSON.parse(text);
                const resp = await fetch(`${API_BASE}/api/roles/import`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(roles)
                });
                if (resp.ok) {
                    showToast(`✅ 已导入 ${roles.length} 个角色`);
                    await loadRoles();
                }
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        async function exportJSON() {
            const resp = await fetch(`${API_BASE}/api/export/json`);
            const data = await resp.json();
            if (data.success) {
                const blob = new Blob([JSON.stringify(data.annotations, null, 2)], {type: 'application/json'});
                downloadBlob(blob, 'annotations.json');
                showToast('📥 JSON已导出');
            }
        }

        async function exportCSV() {
            const resp = await fetch(`${API_BASE}/api/export/csv`);
            const data = await resp.json();
            if (data.success) {
                const blob = new Blob([data.csv], {type: 'text/csv'});
                downloadBlob(blob, 'annotations.csv');
                showToast('📥 CSV已导出');
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch(e.key) {
                case 'ArrowLeft': prevImage(); break;
                case 'ArrowRight': nextImage(); break;
                case 's': case 'S': if (e.ctrlKey || e.metaKey) { e.preventDefault(); saveAnnotation(); } break;
            }
        });

        loadRoles();
    </script>
</body>
</html>
