# =============================================================================
# Anime Role Detect — K8s HorizontalPodAutoscaler
# 基于 CPU 和内存使用率自动扩缩容
# =============================================================================

# --- API Service ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service-hpa
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: api-service-hpa
    app.kubernetes.io/part-of: ardc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5 分钟稳定窗口
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60    # 1 分钟快速扩容
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# --- API Gateway ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: api-gateway-hpa
    app.kubernetes.io/part-of: ardc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# --- Search Worker ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-worker-hpa
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: search-worker-hpa
    app.kubernetes.io/part-of: ardc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30