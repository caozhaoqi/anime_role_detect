  name: model-cache
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: model-cache
    app.kubernetes.io/part-of: ardc-storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard

---
