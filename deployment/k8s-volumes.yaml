# =============================================================================
# Anime Role Detect — K8s PersistentVolumeClaim
# 模型文件、日志、缓存、数据库数据持久化
#
# 注意：
#   - 不指定 storageClassName，使用集群默认 StorageClass
#   - kind 集群默认有 local-path-provisioner（standard 或 local-path）
#   - 生产环境可通过 kubectl patch 或 overlay 指定专用 StorageClass
#   - 模型数据 (model-data) 建议用 OSS/S3 initContainer 同步，或使用 hostPath
# =============================================================================

# --- 模型文件（271MB+，可随版本增长） ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: model-data
    app.kubernetes.io/part-of: ardc-storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# --- 模型缓存（HuggingFace / Keras 缓存） ---
apiVersion: v1
