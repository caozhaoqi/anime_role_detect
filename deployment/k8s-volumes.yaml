# =============================================================================
# Anime Role Detect — K8s PersistentVolumeClaim
# 模型文件、日志、缓存、数据库数据持久化
#
# 注意：
#   - 请根据集群 StorageClass 调整 storageClassName
#   - 生产环境建议使用 ReadWriteMany 的存储（如 NFS/CephFS）供多副本共享
#   - 如果集群不支持动态供给，需要手动创建 PV
#   - 模型数据 (model-data) 建议用 OSS/S3 initContainer 同步，或使用 hostPath
#     PVC 默认 ReadWriteOnce 意味着多节点部署时每节点需要独立 PV
# =============================================================================

# --- 模型文件（271MB+，可随版本增长） ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: model-data
    app.kubernetes.io/part-of: ardc-storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard  # 根据集群实际情况修改

---
# --- 模型缓存（HuggingFace / Keras 缓存） ---
apiVersion: v1
kind: PersistentVolumeClaim
