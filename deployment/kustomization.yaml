# CI Overlay for kind cluster testing
# - Reduces resource requests/limits to fit in GitHub Actions runner (7GB RAM)
# - Reduces replicas from 2 to 1 for api-gateway and frontend
# - Replaces PVCs with emptyDir (CI doesn't need persistence)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s-deploy.yaml
  - k8s-services.yaml
  - k8s-deployments.yaml

replicas:
  - name: api-gateway
    count: 1
  - name: frontend
    count: 1

patches:
  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: Deployment
      name: multimedia-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: Deployment
      name: search-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: Deployment
      name: search-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: rabbitmq
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "32Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"

  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-data
            emptyDir: {}
          - name: model-cache
            emptyDir: {}

  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-data
            emptyDir: {}
          - name: model-cache
            emptyDir: {}

  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: api-cache
            emptyDir: {}

  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: redis-data
            emptyDir: {}

  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: mysql-data
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 30
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MYSQL_INITDB_SKIP_TZINFO
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: INNODB_BUFFER_POOL_SIZE
          value: "64M"

  - target:
      kind: Deployment
      name: rabbitmq
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: rabbitmq-data
            emptyDir: {}

  # --- initContainers to wait for MySQL ---
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-mysql
            image: busybox:1.35
            command: ["sh", "-c", "until nc -z mysql 3306; do echo 'Waiting for MySQL...'; sleep 2; done"]

  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-mysql
            image: busybox:1.35
            command: ["sh", "-c", "until nc -z mysql 3306; do echo 'Waiting for MySQL...'; sleep 2; done"]

  - target:
      kind: Deployment
      name: multimedia-service
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-mysql
            image: busybox:1.35
            command: ["sh", "-c", "until nc -z mysql 3306; do echo 'Waiting for MySQL...'; sleep 2; done"]
