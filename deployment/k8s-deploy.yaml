# =============================================================================
# Anime Role Detect — K8s 基础配置
# Namespace + ConfigMap + Secret
#
# 部署顺序：
#   1. kubectl apply -f k8s-deploy.yaml       # 本文件（Namespace/ConfigMap/Secret）
#   2. kubectl apply -f k8s-volumes.yaml       # PVC（模型/日志/缓存）
#   3. kubectl apply -f k8s-services.yaml      # Service（含基础设施）
#   4. kubectl apply -f k8s-deployments.yaml   # Deployment（含基础设施）
#   5. kubectl apply -f k8s-ingress.yaml       # Ingress
#   6. kubectl apply -f k8s-hpa.yaml           # HPA
#   7. kubectl apply -f k8s-pdb.yaml           # PodDisruptionBudget
#
# 注意：
#   - 默认使用本地镜像前缀 ardc，如需远程仓库请使用 --registry 参数
#   - 生产环境请使用 Sealed Secrets 或 External Secrets Operator 管理密钥
#   - 如使用 GPU，请取消 model-service 中 nvidia.com/gpu 的注释
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: anime-role-detect
  labels:
    app.kubernetes.io/name: anime-role-detect
    app.kubernetes.io/part-of: ardc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ardc-config
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: ardc-config
data:
  # ===================== 应用 =====================
  APP_NAME: "anime-role-detect"
  APP_ENV: "production"
  ENVIRONMENT: "production"
  PYTHONPATH: "/app"
  LOG_LEVEL: "INFO"

  # ===================== 服务发现 =====================
  # 对应 src/core/config/service_config.py 中的 ServiceConfig
  # K8s 内使用 Service 名称进行 DNS 解析
  MODEL_SERVICE_HOST: "model-service"
  MODEL_SERVICE_PORT: "8000"
  CORE_API_HOST: "api-service"
  CORE_API_PORT: "8001"
  MULTIMEDIA_SERVICE_HOST: "multimedia-service"
  MULTIMEDIA_SERVICE_PORT: "8002"
  SEARCH_SERVICE_HOST: "search-service"
  SEARCH_SERVICE_PORT: "8003"
  API_GATEWAY_HOST: "0.0.0.0"
  API_GATEWAY_PORT: "8080"

  USE_MODEL_SERVICE: "true"
  USE_API_GATEWAY: "true"
  ENABLE_NSFW_DETECTION: "true"

  # ===================== Redis =====================
  USE_REDIS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CACHE_STRATEGY: "redis_first"

  # ===================== 缓存 =====================
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  HF_HOME: "/app/cache/huggingface"
  KERAS_HOME: "/app/cache/keras"

  # ===================== 数据库 =====================
  DATABASE_MODE: "mysql"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"

  # ===================== 消息队列 =====================
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"

  # ===================== 模型 =====================
  MODEL_DIR: "/app/models"
  DEFAULT_MODEL: "efficientnet_b3"
  MODEL_DEVICE: "cpu"   # 使用 GPU 时改为 cuda，并取消 Deployment 中 nvidia.com/gpu 注释
  MODEL_WARMUP: "true"
  MODEL_CACHE_ENABLED: "true"
  MODEL_BATCH_SIZE: "8"

  # ===================== 性能 =====================
  # ML 库线程限制（防止 PyTorch 线程爆炸）
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  MKL_THREADING_LAYER: "GNU"
  PYTORCH_MPS_DISABLE: "1"

  # ===================== 监控 =====================
  PROMETHEUS_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"

  # ===================== 安全 =====================
  CORS_ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:8080"]'
  MAX_FILE_SIZE: "52428800"
  REQUEST_TIMEOUT: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: ardc-secrets
  namespace: anime-role-detect
  labels:
    app.kubernetes.io/name: ardc-secrets
type: Opaque
# ⚠️ 生产环境请使用 Sealed Secrets / External Secrets Operator / Vault
# 不要将明文密钥提交到 Git
stringData:
  # ===================== JWT =====================
  JWT_SECRET: "change-me-in-production-use-at-least-64-characters-random-string"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # ===================== 数据库 =====================
  DATABASE_URL: "mysql+pymysql://anime_user:anime_pass@mysql:3306/anime_role_detect"
  MYSQL_USER: "anime_user"
  MYSQL_PASSWORD: "anime_pass"
  MYSQL_DB: "anime_role_detect"
  MYSQL_ROOT_PASSWORD: "root-change-me"

  # ===================== Redis =====================
  REDIS_URL: "redis://redis:6379/0"
  REDIS_PASSWORD: ""

  # ===================== RabbitMQ =====================
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "admin-change-me"

  # ===================== 安全 =====================
  PASSWORD_HASH_ALGORITHM: "bcrypt"
  BCRYPT_ROUNDS: "12"