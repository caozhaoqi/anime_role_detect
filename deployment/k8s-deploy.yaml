apiVersion: v1
kind: Namespace
metadata:
  name: anime-role-detect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ardc-config
  namespace: anime-role-detect
data:
  LOG_LEVEL: "INFO"
  PYTHONPATH: "/app"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  MKL_THREADING_LAYER: "GNU"
---
apiVersion: v1
kind: Secret
metadata:
  name: ardc-secrets
  namespace: anime-role-detect
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/ardc"
  REDIS_URL: "redis://redis:6379/0"
---
# 核心服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: anime-role-detect
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: harbor.example.com/anime-role-detect/api-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ardc-config
        - secretRef:
            name: ardc-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: anime-role-detect
spec:
  selector:
    app: api-service
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: anime-role-detect
  labels:
    app: model-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      containers:
      - name: model-service
        image: harbor.example.com/anime-role-detect/model-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ardc-config
        - secretRef:
            name: ardc-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: anime-role-detect
spec:
  selector:
    app: model-service
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: anime-role-detect
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: harbor.example.com/anime-role-detect/frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: anime-role-detect
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
