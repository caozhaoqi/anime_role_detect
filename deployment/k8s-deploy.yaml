---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ardc-ingress
  namespace: anime-role-detect
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ardc.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
      - path: /model
        pathType: Prefix
        backend:
          service:
            name: model-service
            port:
              number: 80
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /multimedia
        pathType: Prefix
        backend:
          service:
            name: multimedia-service
            port:
              number: 80
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: search-service
            port:
              number: 80
      - path: /monitor
        pathType: Prefix
        backend:
          service:
            name: monitor-dashboard
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80