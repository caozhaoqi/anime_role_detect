# CI Overlay for kind cluster testing
# - Reduces resource requests/limits to fit in GitHub Actions runner (7GB RAM)
# - Reduces replicas from 2 to 1 for api-gateway and frontend
# - Replaces PVCs with emptyDir (CI doesn't need persistence)
# - Skips elasticsearch/kibana (not needed for deploy test)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k8s-deploy.yaml
  # Skip k8s-volumes.yaml — CI uses emptyDir (no persistence needed)
  - ../k8s-services.yaml
  - ../k8s-deployments.yaml

# Reduce replicas for multi-replica deployments
replicas:
  - name: api-gateway
    count: 1
  - name: frontend
    count: 1

# Patch resource requests/limits to fit CI runner
patches:
  # --- model-service: reduce from 4Gi to 2Gi ---
  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  # --- inference-worker: reduce from 4Gi to 1Gi ---
  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  # --- mysql: reduce from 2Gi to 512Mi ---
  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # --- api-service: reduce from 2Gi to 512Mi ---
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # --- multimedia-service: reduce from 2Gi to 512Mi ---
  - target:
      kind: Deployment
      name: multimedia-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # --- search-service: reduce from 2Gi to 512Mi ---
  - target:
      kind: Deployment
      name: search-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # --- search-worker: reduce from 1Gi to 256Mi ---
  - target:
      kind: Deployment
      name: search-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # --- rabbitmq: reduce from 1Gi to 256Mi ---
  - target:
      kind: Deployment
      name: rabbitmq
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # --- api-gateway: reduce from 1Gi to 256Mi ---
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # --- frontend: reduce from 512Mi to 128Mi ---
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "32Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"

  # --- Replace PVC volumes with emptyDir for CI (no persistence needed) ---
  # model-service
  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-data
            emptyDir: {}
          - name: model-cache
            emptyDir: {}

  # inference-worker
  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-data
            emptyDir: {}
          - name: model-cache
            emptyDir: {}

  # api-service
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: api-cache
            emptyDir: {}

  # redis
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: redis-data
            emptyDir: {}

  # mysql
  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: mysql-data
            emptyDir: {}

  # rabbitmq
  - target:
      kind: Deployment
      name: rabbitmq
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: rabbitmq-data
            emptyDir: {}
