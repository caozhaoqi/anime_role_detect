---
# ============================================================
# API Gateway — 入口网关，轻量级
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: anime-role-detect
  labels:
    app: api-gateway
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-gateway
          image: ardc/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ard-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: anime-role-detect
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# ============================================================
# API Service — 核心业务 API
# 实际监听端口 8001（见 deployment/Dockerfile.api-service: EXPOSE 8001 /
# CMD ["python","src/api/app.py"]，app.py 内 uvicorn 绑定 8001）。
# 探针/Service 必须与实际端口一致，否则 startup probe 永远 connection refused。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: anime-role-detect
  labels:
    app: api-service
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        tier: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics/prometheus"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: api-service
          image: ardc/api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ard-config
            - secretRef:
                name: ard-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /live
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: anime-role-detect
spec:
  selector:
    app: api-service
  ports:
    - port: 8001
      targetPort: 8001
---
# ============================================================
# Multimedia Service — 图片/视频处理
# 实际监听端口 8002（deployment/Dockerfile.multimedia-service: EXPOSE 8002 /
# multimedia_service_app.py default --port 8002）。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimedia-service
  namespace: anime-role-detect
  labels:
    app: multimedia-service
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimedia-service
  template:
    metadata:
      labels:
        app: multimedia-service
        tier: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics/prometheus"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: multimedia-service
          image: ardc/multimedia-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: ard-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: multimedia-data
              mountPath: /app/data
      volumes:
        - name: multimedia-data
          persistentVolumeClaim:
            claimName: multimedia-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: multimedia-service
  namespace: anime-role-detect
spec:
  selector:
    app: multimedia-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multimedia-pvc
  namespace: anime-role-detect
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
