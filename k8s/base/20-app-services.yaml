---
# ============================================================
# Monitoring — 监控面板 (Flask)
# 实际监听端口 9000（src/run/monitor/monitor_dashboard.py: MONITOR_PORT = 9000）。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  namespace: anime-role-detect
  labels:
    app: monitoring
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
        tier: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics/prometheus"
        prometheus.io/port: "9000"
    spec:
      containers:
        - name: monitoring
          image: ardc/monitoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ard-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # monitoring 镜像 ENTRYPOINT 为 /entrypoint.sh，必须由参数指定运行模式；
          # 不传参数会命中 "*" 分支打印 Usage 并 exit 1 —— 导致容器立即退出 (CrashLoopBackOff)。
          # monitor-dashboard 提供 /live 与 /ready HTTP 端点，匹配下方探针。
          args: ["monitor-dashboard"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring
  namespace: anime-role-detect
spec:
  selector:
    app: monitoring
  ports:
    - port: 9000
      targetPort: 9000
