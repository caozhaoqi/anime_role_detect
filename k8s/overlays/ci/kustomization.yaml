# ============================================================
# CI Overlay — kind 单节点集群测试用（非生产）
# - 副本降为 1（kind 单节点）
# - 资源 requests/limits 大幅下调，适配 GitHub Actions runner (~7GB RAM)
# - PVC → emptyDir（CI 无需持久化，且 kind 默认无动态供给）
# - 移除 model-service 的 GPU nodeSelector / tolerations（CI 为纯 CPU 节点）
# - 为 MySQL 增加 startupProbe，避免慢启动被 liveness 杀掉
# - 降低部分探针阈值，加速 CI 内 readiness 收敛
#
# 用法: kubectl apply -k k8s/overlays/ci/
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 继承基础 k8s/base/ 的全部资源
resources:
  - ../../base

replicas:
  - name: api-gateway
    count: 1
  - name: api-service
    count: 1
  - name: inference-worker
    count: 1
  - name: frontend
    count: 1

patches:
  # ---------- 基础设施：降配 + PVC→emptyDir ----------
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: redis-data
            emptyDir: {}
  - target:
      kind: Deployment
      name: rabbitmq
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: rabbitmq-data
            emptyDir: {}
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 30
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MYSQL_INITDB_SKIP_TZINFO
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: INNODB_BUFFER_POOL_SIZE
          value: "64M"

  # ---------- 应用服务：降配 ----------
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: Deployment
      name: multimedia-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: multimedia-data
            emptyDir: {}
  - target:
      kind: Deployment
      name: search-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: Deployment
      name: monitoring
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # ---------- model-service：去 GPU 亲和 + 降配 ----------
  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/tolerations
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: model-storage
            emptyDir: {}

  # ---------- workers：降配 ----------
  - target:
      kind: Deployment
      name: search-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1.5Gi"
  - target:
      kind: Deployment
      name: celery-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
  - target:
      kind: Deployment
      name: celery-beat
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # ---------- frontend：降配 ----------
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # ---------- 阻断 HF / 模型在线下载 ----------
  # CI 的 kind 节点无外网出口，load_models / model_version_service 若尝试从
  # HuggingFace 拉模型会无限阻塞，导致 lifespan 永不完成 → 探针超时 → kubelet 杀容器 →
  # CrashLoopBackOff。置 OFFLINE 后缺失模型会快速报 Missing/Offline 错误（被 _init_services
  # 的 try/except 捕获并记录 warning），应用正常启动。
  - target:
      kind: ConfigMap
      name: ard-config
    patch: |-
      - op: add
        path: /data/HF_HUB_OFFLINE
        value: "1"
      - op: add
        path: /data/TRANSFORMERS_OFFLINE
        value: "1"
      - op: add
        path: /data/TOKENIZERS_PARALLELISM
        value: "false"

  # ---------- 为重型 / 模型服务增加 startupProbe ----------
  # 避免 import torch / 加载模型 / 连接依赖服务等慢启动被 liveness 误杀。
  # failureThreshold*periodSeconds = 300s 宽限，超过才判定失败。
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
  - target:
      kind: Deployment
      name: multimedia-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 8002
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
  - target:
      kind: Deployment
      name: search-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 8003
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
  - target:
      kind: Deployment
      name: monitoring
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
  - target:
      kind: Deployment
      name: model-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 30
