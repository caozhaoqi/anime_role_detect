[supervisord]
nodaemon=true
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs
loglevel=info
logfile_maxbytes=10MB
logfile_backups=50
pidfile_maxbytes=1MB

[program:model-service]
command=%(here)s/.venv/bin/python3 %(here)s/src/services/model_service/app.py --host 0.0.0.0 --port 8000
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",OMP_NUM_THREADS="4",MKL_NUM_THREADS="4",KMP_DUPLICATE_LIB_OK="TRUE",OTEL_ENABLED="true",INTERNAL_SERVICE_TOKEN="%(ENV_INTERNAL_SERVICE_TOKEN)s"
stdout_logfile=%(here)s/logs/services/model-service/model-service.log
stderr_logfile=%(here)s/logs/services/model-service/model-service.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=30
stopwaitsecs=30
startretries=3
priority=100

[program:api-service]
command=%(here)s/.venv/bin/python3 %(here)s/src/api/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",KMP_DUPLICATE_LIB_OK="TRUE",MKL_THREADING_LAYER="GNU",OTEL_ENABLED="true"
stdout_logfile=%(here)s/logs/services/api-service/api-service.log
stderr_logfile=%(here)s/logs/services/api-service/api-service.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=30
startretries=3
priority=90

[program:api-gateway]
command=%(here)s/.venv/bin/python3 %(here)s/src/services/api_gateway/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",OTEL_ENABLED="true"
stdout_logfile=%(here)s/logs/services/api-gateway/api-gateway.log
stderr_logfile=%(here)s/logs/services/api-gateway/api-gateway.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=30
startretries=3
priority=80

[program:multimedia-service]
command=%(here)s/.venv/bin/python3 %(here)s/src/services/multimedia_service/multimedia_service_app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/services/multimedia-service/multimedia-service.log
stderr_logfile=%(here)s/logs/services/multimedia-service/multimedia-service.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=30
startretries=3
priority=70

[program:search-service]
command=%(here)s/.venv/bin/python3 %(here)s/src/services/search_service/app_queue.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/services/search-service/search-service.log
stderr_logfile=%(here)s/logs/services/search-service/search-service.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=30
startretries=3
priority=60

[program:t2i-service]
command=%(here)s/t2i-mac/bin/python3 %(here)s/src/services/t2i_service/app.py --port 8100
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",INTERNAL_SERVICE_TOKEN="%(ENV_INTERNAL_SERVICE_TOKEN)s"
stdout_logfile=%(here)s/logs/services/t2i-service/t2i-service.log
stderr_logfile=%(here)s/logs/services/t2i-service/t2i-service.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=30
startretries=3
priority=55

[program:search-worker]
command=%(here)s/src/run/sh/start_search_worker.sh
directory=%(here)s
stdout_logfile=%(here)s/logs/services/search-service/search-worker.log
stderr_logfile=%(here)s/logs/services/search-service/search-worker.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=35
stopwaitsecs=30
startretries=3
priority=50

[program:celery-worker]
command=%(here)s/.venv/bin/python3 -m celery -A src.tasks.celery_app worker --loglevel=info -Q celery,image_queue,video_queue,model_queue -n classify@%%h
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",RABBITMQ_HOST="localhost",RABBITMQ_PORT="5672",RABBITMQ_USER="guest",RABBITMQ_PASSWORD="guest",REDIS_HOST="localhost",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",KMP_DUPLICATE_LIB_OK="TRUE",MKL_THREADING_LAYER="GNU"
stdout_logfile=%(here)s/logs/services/celery-worker/celery-worker.log
stderr_logfile=%(here)s/logs/services/celery-worker/celery-worker.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=25
stopwaitsecs=30
startretries=3
priority=47

[program:inference-worker]
command=%(here)s/.venv/bin/python3 %(here)s/src/services/inference_worker/worker.py --num-workers 2 --model ViT-B/32
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",KMP_DUPLICATE_LIB_OK="TRUE",MKL_THREADING_LAYER="GNU"
stdout_logfile=%(here)s/logs/services/inference-worker/inference-worker.log
stderr_logfile=%(here)s/logs/services/inference-worker/inference-worker.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=60
stopwaitsecs=30
startretries=3
priority=45

[program:frontend]
command=bash -c "npm run build && npm start"
directory=%(here)s/src/frontend
environment=PORT="3000",NODE_ENV="production",PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=%(here)s/logs/services/frontend/frontend.log
stderr_logfile=%(here)s/logs/services/frontend/frontend.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=30
stopwaitsecs=30
startretries=3
priority=30

[program:health-check]
command=%(here)s/.venv/bin/python3 %(here)s/scripts/monitoring/health_check.py --daemon --interval 60
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/services/monitoring/health-check.log
stderr_logfile=%(here)s/logs/services/monitoring/health-check.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
startretries=3
priority=20

[program:log-monitor]
command=%(here)s/.venv/bin/python3 %(here)s/scripts/monitoring/log_monitor.py --daemon --interval 10
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/services/monitoring/log-monitor.log
stderr_logfile=%(here)s/logs/services/monitoring/log-monitor.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
startretries=3
priority=15

[program:resource-monitor]
command=%(here)s/.venv/bin/python3 %(here)s/scripts/monitoring/resource_monitor.py --daemon --interval 30
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/services/monitoring/resource-monitor.log
stderr_logfile=%(here)s/logs/services/monitoring/resource-monitor.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
startretries=3
priority=10

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001


[inet_http_server]
port=127.0.0.1:9001
username=CHANGE_ME_supervisor_admin
password=CHANGE_ME_supervisor_pwd