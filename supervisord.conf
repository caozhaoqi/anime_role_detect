[supervisord]
nodaemon=true
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs
loglevel=info
logfile_maxbytes=50MB
logfile_backups=10

[program:model-service]
command=python3 %(here)s/src/services/model_service/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/model-service.log
stderr_logfile=%(here)s/logs/model-service.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
autostart=true
autorestart=unexpected
startsecs=15
stopwaitsecs=30
priority=100

[program:api-service]
command=python3 %(here)s/src/api/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s",LOG_LEVEL="INFO"
stdout_logfile=%(here)s/logs/api-service.log
stderr_logfile=%(here)s/logs/api-service.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
autostart=true
autorestart=unexpected
startsecs=10
stopwaitsecs=30
priority=90

