[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:model-service]
command=python3 %(here)s/src/services/model_service/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s"
stdout_logfile=/tmp/model-service.log
stderr_logfile=/tmp/model-service.err.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30

[program:api-service]
command=python3 %(here)s/src/api/app.py
directory=%(here)s
environment=PYTHONPATH="%(here)s"
stdout_logfile=/tmp/api-service.log
