name: K8s Deploy Test
on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'deployment/Dockerfile.*'
      - 'scripts/k8s/**'
      - '.github/workflows/k8s-deploy-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'deployment/Dockerfile.*'
      - 'scripts/k8s/**'
      - '.github/workflows/k8s-deploy-test.yml'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ardc
  KIND_CLUSTER_NAME: ardc-test
  KIND_NODE_IMAGE: kindest/node:v1.29.2

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/ardc/base
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.base
          push: false
          tags: |
            ardc/base:${{ steps.meta.outputs.version }}
            ardc/base:latest
          load: true

      - name: Build ml-base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.ml-base
          push: false
          tags: |
            ardc/ml-base:${{ steps.meta.outputs.version }}
            ardc/ml-base:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build api-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.api-service
          push: false
          tags: |
            ardc/api-service:${{ steps.meta.outputs.version }}
            ardc/api-service:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build api-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.api-gateway
          push: false
          tags: |
            ardc/api-gateway:${{ steps.meta.outputs.version }}
            ardc/api-gateway:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build model-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.model-service
          push: false
          tags: |
            ardc/model-service:${{ steps.meta.outputs.version }}
            ardc/model-service:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/ml-base:${{ steps.meta.outputs.version }}

      - name: Build multimedia-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.multimedia-service
          push: false
          tags: |
            ardc/multimedia-service:${{ steps.meta.outputs.version }}
            ardc/multimedia-service:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build search-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.search-service
          push: false
          tags: |
            ardc/search-service:${{ steps.meta.outputs.version }}
            ardc/search-service:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build search-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.search-worker
          push: false
          tags: |
            ardc/search-worker:${{ steps.meta.outputs.version }}
            ardc/search-worker:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }}

      - name: Build inference-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.inference-worker
          push: false
          tags: |
            ardc/inference-worker:${{ steps.meta.outputs.version }}
            ardc/inference-worker:latest
          load: true
          build-args: |
            BASE_IMAGE=ardc/ml-base:${{ steps.meta.outputs.version }}

      - name: Build monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.monitoring
          push: false
          tags: |
            ardc/monitoring:${{ steps.meta.outputs.version }}
            ardc/monitoring:latest
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.frontend
          push: false
          tags: |
            ardc/frontend:${{ steps.meta.outputs.version }}
            ardc/frontend:latest
          load: true

      - name: List images
        run: docker images | grep ardc

      - name: Save images to tar
        run: |
          mkdir -p /tmp/images
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep ardc); do
            echo "Saving $img..."
            safe_name=$(echo "$img" | tr '/' '-' | tr ':' '-')
            docker save "$img" -o "/tmp/images/${safe_name}.tar"
          done
          ls -la /tmp/images/

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images/*.tar
          retention-days: 1

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Load images
        run: |
          for tar_file in /tmp/images/*.tar; do
            echo "Loading $tar_file..."
            docker load -i "$tar_file"
          done
          docker images | grep ardc

      - name: Create kind config file
        run: |
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              listenAddress: "0.0.0.0"
            - containerPort: 443
              hostPort: 443
              listenAddress: "0.0.0.0"
          EOF
          cat /tmp/kind-config.yaml

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: /tmp/kind-config.yaml
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Ensure default StorageClass
        run: |
          echo "=== Available StorageClasses ==="
          kubectl get sc
          # Ensure the default StorageClass has the default annotation
          DEFAULT_SC=$(kubectl get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}')
          if [ -z "$DEFAULT_SC" ]; then
            # Pick the first available StorageClass and make it default
            FIRST_SC=$(kubectl get sc -o jsonpath='{.items[0].metadata.name}')
            if [ -n "$FIRST_SC" ]; then
              echo "Setting $FIRST_SC as default StorageClass"
              kubectl patch sc "$FIRST_SC" -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
            else
              echo "WARNING: No StorageClass found in cluster!"
            fi
          else
            echo "Default StorageClass: $DEFAULT_SC"
          fi

      - name: Load images to kind cluster
        run: |
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep ardc); do
            echo "Loading $img to kind cluster..."
            kind load docker-image "$img" --name ${{ env.KIND_CLUSTER_NAME }}
          done

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get sc

      - name: Apply K8s manifests (CI overlay)
        run: |
          # Use kustomize CI overlay: reduced resources + emptyDir volumes (kind single-node)
          kubectl apply -k k8s/overlays/ci/

      - name: Wait for PVCs to bind
        run: |
          # CI overlay uses emptyDir, so no PVCs expected
          PVC_COUNT=$(kubectl get pvc -n anime-role-detect --no-headers 2>/dev/null | wc -l || echo 0)
          if [ "$PVC_COUNT" -gt 0 ]; then
            echo "Waiting for $PVC_COUNT PVCs to be Bound..."
            kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc --all -n anime-role-detect --timeout=60s || true
            kubectl get pvc -n anime-role-detect
          else
            echo "No PVCs in CI overlay (using emptyDir) — skipping wait"
          fi

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod -n anime-role-detect --all --timeout=300s || true

      - name: Check pod status
        if: always()
        run: |
          kubectl get pods -n anime-role-detect -o wide

      - name: Check services and PVCs
        if: always()
        run: |
          echo "=== Services ==="
          kubectl get svc -n anime-role-detect
          echo ""
          echo "=== PVCs ==="
          kubectl get pvc -n anime-role-detect

      - name: Diagnose failed pods
        if: always()
        run: |
          echo "=== Pod Status Summary ==="
          kubectl get pods -n anime-role-detect --no-headers | awk '{print $1, $2, $3, $4}'

          # NOTE: kubectl jsonpath does NOT support '!=' or '||', so the previous
          # filter returned empty and the "All pods are running" false-positive hid
          # every crash. We now iterate over ALL pods and inspect phase/restartCount
          # individually — this reliably dumps CrashLoopBackOff container stderr.
          found=0
          for p in $(kubectl get pods -n anime-role-detect -o name 2>/dev/null); do
            name="${p#pod/}"
            phase=$(kubectl get "$p" -n anime-role-detect -o jsonpath='{.status.phase}' 2>/dev/null || true)
            restarts=$(kubectl get "$p" -n anime-role-detect -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null || echo 0)
            restarts="${restarts:-0}"
            # CrashLoopBackOff keeps phase=Running but accumulates restarts; also
            # catch Pending/Failed and any restart > 0.
            if [[ "$phase" != "Running" || "${restarts}" -gt 0 ]]; then
              found=1
              echo ""
              echo "=============================================="
              echo "=== PROBLEM: $name (phase=$phase, restarts=$restarts) ==="
              echo "=============================================="
              echo "--- describe (last 40 lines) ---"
              kubectl describe "$p" -n anime-role-detect 2>/dev/null | tail -40 || true
              echo ""
              echo "--- current logs ---"
              kubectl logs "$p" -n anime-role-detect --tail=80 2>/dev/null || true
              echo ""
              echo "--- previous (crashed) container logs ---"
              kubectl logs "$p" -n anime-role-detect --previous --tail=80 2>/dev/null || echo "(no previous container logs)"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo ""
            echo "All pods are Running with 0 restarts!"
          fi

      - name: Summary
        if: always()
        run: |
          echo "=============================================="
          echo "=== Deployment Summary ==="
          echo "=============================================="
          echo ""
          echo "Pods:"
          kubectl get pods -n anime-role-detect --no-headers 2>/dev/null | awk '{printf "  %-40s %s/%s %s (restarts: %s)\n", $1, $2, $3, $5, $4}'
          echo ""
          echo "PVCs:"
          kubectl get pvc -n anime-role-detect --no-headers 2>/dev/null | awk '{printf "  %-30s %s\n", $1, $2}'
          echo ""
          ready=$(kubectl get pods -n anime-role-detect --field-selector=status.phase=Running --no-headers 2>/dev/null | grep -c "1/1\|Running" || echo 0)
          total=$(kubectl get pods -n anime-role-detect --no-headers 2>/dev/null | wc -l || echo 0)
          echo "Ready: $ready / $total pods"

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name ${{ env.KIND_CLUSTER_NAME }} || true
