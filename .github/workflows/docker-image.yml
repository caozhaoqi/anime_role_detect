name: Build and Test
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ardc' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          echo "=== After cleanup ==="
          df -h

  test:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt

      - name: Run tests
        run: python -c "print('Test environment OK')"

  build-base-images:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ardc/base
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          df -h

      - name: Build base image
        run: |
          docker build -t ardc/base:${{ steps.meta.outputs.version }} -t ardc/base:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.base .
          docker system df

      - name: Save base image for caching
        run: |
          mkdir -p /tmp/docker-cache
          docker save ardc/base:${{ steps.meta.outputs.version }} -o /tmp/docker-cache/base.tar
          ls -la /tmp/docker-cache/

      - name: Upload base image artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-image-${{ steps.meta.outputs.version }}
          path: /tmp/docker-cache/base.tar
          retention-days: 1

      - name: Disk usage report
        run: df -h

  build-service-images:
    runs-on: ubuntu-latest
    needs: build-base-images
    outputs:
      version: ${{ needs.build-base-images.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          df -h

      - name: Download base image artifact
        uses: actions/download-artifact@v4
        with:
          name: base-image-${{ needs.build-base-images.outputs.version }}
          path: /tmp/docker-cache

      - name: Load base image
        run: |
          docker load -i /tmp/docker-cache/base.tar
          docker tag ardc/base:${{ needs.build-base-images.outputs.version }} ardc/base:latest
          docker images | grep ardc/base

      - name: Build api-service image
        run: |
          docker build -t ardc/api-service:${{ needs.build-base-images.outputs.version }} -t ardc/api-service:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.api-service .

      - name: Build api-gateway image
        run: |
          docker build -t ardc/api-gateway:${{ needs.build-base-images.outputs.version }} -t ardc/api-gateway:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.api-gateway .

      - name: Build multimedia-service image
        run: |
          docker build -t ardc/multimedia-service:${{ needs.build-base-images.outputs.version }} -t ardc/multimedia-service:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.multimedia-service .

      - name: Build search-service image
        run: |
          docker build -t ardc/search-service:${{ needs.build-base-images.outputs.version }} -t ardc/search-service:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.search-service .

      - name: Build search-worker image
        run: |
          docker build -t ardc/search-worker:${{ needs.build-base-images.outputs.version }} -t ardc/search-worker:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.search-worker .

      - name: Build monitoring image
        run: |
          docker build -t ardc/monitoring:${{ needs.build-base-images.outputs.version }} -t ardc/monitoring:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.monitoring .

      - name: Build frontend image
        run: |
          docker build -t ardc/frontend:${{ needs.build-base-images.outputs.version }} -t ardc/frontend:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.frontend .

      - name: Disk usage report
        run: df -h

  build-ml-images:
    runs-on: ubuntu-latest
    needs: build-base-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          df -h

      - name: Download base image artifact
        uses: actions/download-artifact@v4
        with:
          name: base-image-${{ needs.build-base-images.outputs.version }}
          path: /tmp/docker-cache

      - name: Load base image
        run: |
          docker load -i /tmp/docker-cache/base.tar
          docker tag ardc/base:${{ needs.build-base-images.outputs.version }} ardc/base:latest
          docker images | grep ardc/base

      - name: Build ml-base image
        run: |
          docker build -t ardc/ml-base:${{ needs.build-base-images.outputs.version }} -t ardc/ml-base:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.ml-base .
          docker system df

      - name: Build model-service image
        run: |
          docker build -t ardc/model-service:${{ needs.build-base-images.outputs.version }} -t ardc/model-service:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/ml-base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.model-service .
          docker system df

      - name: Build inference-worker image
        run: |
          docker build -t ardc/inference-worker:${{ needs.build-base-images.outputs.version }} -t ardc/inference-worker:latest \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BUILD_TAG=${{ needs.build-base-images.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/ml-base:${{ needs.build-base-images.outputs.version }} \
            -f deployment/Dockerfile.inference-worker .
          docker system df

      - name: Disk usage report
        run: df -h

  verify-images:
    runs-on: ubuntu-latest
    needs: [build-service-images, build-ml-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify artifact exists
        uses: actions/download-artifact@v4
        with:
          name: base-image-${{ needs.build-service-images.outputs.version }}
          path: /tmp/docker-cache

      - name: Verify build artifacts
        run: |
          echo "=== Build Verification ==="
          echo "Base image artifact: $(ls -la /tmp/docker-cache/ 2>/dev/null || echo 'Not found')"
          echo "Build version: ${{ needs.build-service-images.outputs.version }}"
          echo "=== All builds completed successfully ==="

      - name: Disk usage final report
        run: |
          echo "=== Disk Usage ==="
          df -h