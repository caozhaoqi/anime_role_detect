name: Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ardc' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          echo "=== After cleanup ==="
          df -h

  test:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt

      - name: Run tests
        run: python -c "print('Test environment OK')"

  build-all-images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ardc/base
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build base image
        run: |
          docker build -t ardc/base:${{ steps.meta.outputs.version }} -t ardc/base:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.base .

      - name: Build ml-base image
        run: |
          docker build -t ardc/ml-base:${{ steps.meta.outputs.version }} -t ardc/ml-base:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.ml-base .

      - name: Build api-service image
        run: |
          docker build -t ardc/api-service:${{ steps.meta.outputs.version }} -t ardc/api-service:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.api-service .

      - name: Build api-gateway image
        run: |
          docker build -t ardc/api-gateway:${{ steps.meta.outputs.version }} -t ardc/api-gateway:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.api-gateway .

      - name: Build model-service image
        run: |
          docker build -t ardc/model-service:${{ steps.meta.outputs.version }} -t ardc/model-service:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/ml-base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.model-service .

      - name: Build multimedia-service image
        run: |
          docker build -t ardc/multimedia-service:${{ steps.meta.outputs.version }} -t ardc/multimedia-service:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.multimedia-service .

      - name: Build search-service image
        run: |
          docker build -t ardc/search-service:${{ steps.meta.outputs.version }} -t ardc/search-service:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.search-service .

      - name: Build search-worker image
        run: |
          docker build -t ardc/search-worker:${{ steps.meta.outputs.version }} -t ardc/search-worker:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.search-worker .

      - name: Build inference-worker image
        run: |
          docker build -t ardc/inference-worker:${{ steps.meta.outputs.version }} -t ardc/inference-worker:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            --build-arg BASE_IMAGE=ardc/ml-base:${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.inference-worker .

      - name: Build monitoring image
        run: |
          docker build -t ardc/monitoring:${{ steps.meta.outputs.version }} -t ardc/monitoring:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.monitoring .

      - name: Build frontend image
        run: |
          docker build -t ardc/frontend:${{ steps.meta.outputs.version }} -t ardc/frontend:latest \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg BUILD_TAG=${{ steps.meta.outputs.version }} \
            -f deployment/Dockerfile.frontend .

      - name: List all images
        run: |
          echo "=== All built images ==="
          docker images | grep ardc

      - name: Disk usage report
        run: |
          echo "=== Disk Usage ==="
          df -h
          echo "=== Docker Usage ==="
          docker system df || true
