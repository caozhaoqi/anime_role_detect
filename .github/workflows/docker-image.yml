name: Simple CI Demo

# 触发条件：当代码推送到 main 分支时执行
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. 执行一个简单的命令
      - name: Hello World
        run: |
          echo "开始运行 CI 流程..."
          python --version
          echo "环境检查完毕！"

      # 4. 尝试构建 Docker 镜像（仅本地构建，不推送）
      - name: Build Docker Image
        run: docker build . -t my-demo-app:latest