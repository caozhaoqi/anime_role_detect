name: Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          echo "=== After cleanup ==="
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt

      - name: Run tests
        run: python -c "print('Test environment OK')"

      - name: Build base image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            -t ardc/base:ci-test \
            -f deployment/Dockerfile.base \
            .

      - name: Build service image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --build-arg BASE_IMAGE=ardc/base:ci-test \
            -t ardc/api-service:ci-test \
            -f deployment/Dockerfile.api-service \
            .

      - name: Disk usage report
        if: always()
        run: |
          echo "=== Disk Usage ==="
          df -h
          echo "=== Docker Usage ==="
          docker system df || true
